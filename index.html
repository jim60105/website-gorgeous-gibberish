<body class="bg-bg-primary text-text-primary min-h-screen font-primary">
    
    <!-- Initial State Container -->
    <main id="app" class="min-h-screen flex flex-col items-center justify-center px-4">
        
        <!-- Hero Section -->
        <div class="hero-container text-center mb-8 layout-transition">
            <h1 class="hero-title font-title text-5xl md:text-8xl lg:text-9xl font-bold tracking-tight">
                <span class="text-white hover:text-gray-200 transition-colors duration-300">
                    絢
                </span>
            </h1>
        </div>
        
        <!-- Input Section -->
        <div id="input-container" class="w-full max-w-xl layout-transition">
            
            <!-- Input Row -->
            <div class="flex items-center gap-3">
                <div class="relative flex-1">
                    <input 
                        type="text" 
                        id="user-input"
                        class="w-full bg-bg-secondary border border-border-color rounded-xl 
                               px-4 py-3.5 text-lg
                               text-text-primary placeholder-text-muted
                               focus:outline-none focus:border-white focus:ring-2 focus:ring-white/10
                               transition-all duration-200
                               input-interactive"
                        placeholder=""
                        maxlength="20"
                        autocomplete="off"
                        spellcheck="false"
                    >
                </div>
                
                <button 
                    id="send-button"
                    class="flex-shrink-0 bg-white text-bg-primary 
                           w-12 h-12 rounded-xl
                           flex items-center justify-center
                           text-xl font-bold
                           hover:bg-gray-100 active:bg-gray-200
                           disabled:opacity-50 disabled:cursor-not-allowed
                           transition-all duration-200
                           btn-interactive"
                    aria-label="擲語入虛"
                    title="擲語入虛"
                >
                    →
                </button>
            </div>
            
            <!-- Input Meta Row -->
            <div class="flex justify-between items-center mt-2 px-1">
                <span id="input-error" class="text-red-400 text-sm opacity-0 transition-opacity duration-200 min-h-[1.25rem]" aria-live="polite"></span>
                <span id="char-count" class="text-meta text-text-muted">0/20</span>
            </div>
            
        </div>
        
    </main>
    
    <!-- Chat State Container (initially hidden) -->
    <div id="chat-container" class="min-h-screen flex flex-col hidden">
        
        <!-- Chat Header -->
        <header class="chat-header fixed top-0 left-0 right-0 bg-bg-primary/95 backdrop-blur-sm border-b border-border-color z-10 safe-area-top">
            <div class="container mx-auto px-4 py-3 flex items-center justify-between">
                <h1 class="text-xl font-bold text-white font-title">絢</h1>
                <div class="flex items-center gap-3">
                    <a 
                        href="https://github.com/jim60105/website-gorgeous-gibberish"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="text-text-muted hover:text-white transition-colors"
                        aria-label="GitHub"
                    >
                        <svg class="w-[1.4rem] h-[1.4rem]" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M56.7937 84.9688C44.4187 83.4688 35.7 74.5625 35.7 63.0313C35.7 58.3438 37.3875 53.2813 40.2 49.9063C38.9812 46.8125 39.1687 40.25 40.575 37.5313C44.325 37.0625 49.3875 39.0313 52.3875 41.75C55.95 40.625 59.7 40.0625 64.2937 40.0625C68.8875 40.0625 72.6375 40.625 76.0125 41.6563C78.9187 39.0313 84.075 37.0625 87.825 37.5313C89.1375 40.0625 89.325 46.625 88.1062 49.8125C91.1062 53.375 92.7 58.1563 92.7 63.0313C92.7 74.5625 83.9812 83.2813 71.4187 84.875C74.6062 86.9375 76.7625 91.4375 76.7625 96.5938L76.7625 106.344C76.7625 109.156 79.1062 110.75 81.9187 109.625C98.8875 103.156 112.2 86.1875 112.2 65.1875C112.2 38.6563 90.6375 17 64.1062 17C37.575 17 16.2 38.6562 16.2 65.1875C16.2 86 29.4187 103.25 47.2312 109.719C49.7625 110.656 52.2 108.969 52.2 106.438L52.2 98.9375C50.8875 99.5 49.2 99.875 47.7 99.875C41.5125 99.875 37.8562 96.5 35.2312 90.2188C34.2 87.6875 33.075 86.1875 30.9187 85.9063C29.7937 85.8125 29.4187 85.3438 29.4187 84.7813C29.4187 83.6563 31.2937 82.8125 33.1687 82.8125C35.8875 82.8125 38.2312 84.5 40.6687 87.9688C42.5437 90.6875 44.5125 91.9063 46.8562 91.9063C49.2 91.9063 50.7 91.0625 52.8562 88.9063C54.45 87.3125 55.6687 85.9063 56.7937 84.9688Z" fill="currentColor"/>
                        </svg>
                    </a>
                    <button 
                        id="help-button"
                        class="text-text-muted hover:text-white transition-colors"
                        aria-label="說明"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </button>
                    <button 
                        id="reset-button"
                        class="flex items-center gap-2 text-text-muted hover:text-white 
                               text-sm px-3 py-1.5 rounded-lg
                               hover:bg-white/5
                               transition-all duration-200"
                        aria-label="焚卷重衍"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                        <span>焚卷重衍</span>
                    </button>
                </div>
            </div>
        </header>
        
        <!-- Main Content Area -->
        <!-- pt-[90px]: 90px padding-top to accommodate fixed header (Task 9.6) -->
        <!-- pb-[200px]: 200px padding-bottom to prevent content from being covered by fixed footer -->
        <main class="flex-1 pt-[90px] pb-[200px] px-4">
            <div class="container mx-auto max-w-2xl">
                
                <!-- Topic Display -->
                <div id="topic-section" class="mb-6 pb-4 border-b border-border-color/50 hidden">
                    <div class="flex items-center gap-2">
                        <span class="text-text-muted text-sm">宙軸</span>
                        <span class="text-text-muted">·</span>
                        <span id="topic-display" class="text-text-secondary text-sm font-medium"></span>
                    </div>
                </div>
                
                <!-- AI Response Area -->
                <div id="ai-response-container" class="hidden">
                    <p id="ai-response" class="text-lg md:text-xl lg:text-2xl leading-relaxed md:leading-loose text-white text-streaming"></p>
                </div>
                
            </div>
        </main>
        
        <!-- Fixed Bottom Input -->
        <footer class="fixed bottom-0 left-0 right-0 bg-bg-primary/95 backdrop-blur-sm border-t border-border-color p-4 safe-area-bottom">
            <div class="container mx-auto max-w-xl">
                
                <!-- Conversation Dots and Character Count -->
                <div class="flex items-center justify-between mb-3">
                    <div id="conversation-dots" class="flex items-center gap-1.5" aria-label="對話進度">
                        <!-- Will be populated by JavaScript -->
                    </div>
                    <span id="char-count-chat" class="text-meta text-text-muted">0/20</span>
                </div>
                
                <!-- Input Row -->
                <div class="flex items-center gap-3">
                    <div class="relative flex-1">
                        <input 
                            type="text" 
                            id="user-input-chat"
                            class="w-full bg-bg-secondary border border-border-color rounded-xl 
                                   px-4 py-3.5 text-base md:text-lg
                                   text-text-primary placeholder-text-muted
                                   focus:outline-none focus:border-white focus:ring-2 focus:ring-white/10
                                   transition-all duration-200
                                   input-interactive"
                            placeholder=""
                            maxlength="20"
                            autocomplete="off"
                            spellcheck="false"
                        >
                    </div>
                    
                    <button 
                        id="send-button-chat"
                        class="flex-shrink-0 bg-white text-bg-primary 
                               w-12 h-12 rounded-xl
                               flex items-center justify-center
                               text-xl font-bold
                               hover:bg-gray-100 active:bg-gray-200
                               disabled:opacity-50 disabled:cursor-not-allowed
                               transition-all duration-200
                               btn-interactive"
                        aria-label="擲語入虛"
                        title="擲語入虛"
                    >
                        →
                    </button>
                </div>
                
                <!-- Input Meta Row -->
                <div class="flex justify-between items-center mt-2 px-1">
                    <span id="input-error-chat" class="text-red-400 text-sm opacity-0 transition-opacity duration-200 min-h-[1.25rem]" aria-live="polite"></span>
                </div>
                
            </div>
        </footer>
        
    </div>
    
    <!-- Network status toast (Task 6.1.2) -->
    <div id="network-toast" class="network-toast hidden"></div>
    
    <!-- Help Modal (Task 6.3.3) -->
    <div id="help-modal" class="modal-backdrop hidden">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-4">
                <h2 id="help-modal-title" class="modal-title">奧義玄樞</h2>
                <button 
                    id="toggle-help-style"
                    class="text-text-muted hover:text-white text-sm px-3 py-1 rounded-lg hover:bg-white/5 transition-all duration-200"
                    aria-label="切換說明風格"
                >
                    惘然
                </button>
            </div>
            
            <div class="space-y-4 text-text-secondary text-sm">
                <div>
                    <h3 id="help-section1-title" class="text-white font-medium mb-1">循徑窺奧</h3>
                    <p id="help-section1-content">鍍念二十字內，擊 Enter 或觸「擲語入虛」，靈思幻核即綻放絢燦迴響。</p>
                </div>
                
                <div>
                    <h3 id="help-section2-title" class="text-white font-medium mb-1">五語星閾</h3>
                    <p id="help-section2-content">五番星霜語後，輪迴閾至；觸「焚卷重衍」即投新生。</p>
                </div>
            </div>
            
            <button 
                id="close-help"
                class="mt-6 w-full bg-white text-bg-primary py-2 rounded-lg font-medium hover:bg-gray-200 transition-colors"
            >
                <span id="help-close-text">印可</span>
            </button>
        </div>
    </div>
    
    <!-- JavaScript modules -->
    <script type="module" src="js/main.js"></script>
