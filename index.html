<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="絢 - AI 聊天機器人，視覺簡約與文字絢爛的反差美學">
    <title>絢</title>
    
    <!-- Google Fonts: Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Google Fonts: Yuji Boku (標題，只載入「絢」字) + Iansui (內文) -->
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Boku&display=swap&text=絢" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Iansui&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="dist/styles.css">
    
    <!-- Import map for OpenAI SDK (browser-based ES modules) -->
    <script type="importmap">
    {
      "imports": {
        "openai": "https://cdn.jsdelivr.net/npm/openai@4.77.3/+esm"
      }
    }
    </script>
</head>
<body class="bg-bg-primary text-text-primary min-h-screen font-primary">
    
    <!-- Initial State Container -->
    <main id="app" class="min-h-screen flex flex-col items-center justify-center px-4">
        
        <!-- Hero Section -->
        <div class="hero-container text-center mb-8 layout-transition">
            <h1 class="hero-title font-title text-5xl md:text-8xl lg:text-9xl font-bold tracking-tight mb-4">
                <span class="text-white hover:text-gray-200 transition-colors duration-300">
                    絢
                </span>
            </h1>
            <p class="hero-subtitle text-text-muted text-sm md:text-base">
                輸入簡短詞語，獲得絢爛回應
            </p>
        </div>
        
        <!-- Usage Hint -->
        <div class="usage-hint text-center mb-6 layout-transition">
            <p class="text-text-muted text-sm">
                輸入您的想法，按 Enter 或點擊傳送
            </p>
            <p class="text-text-muted/60 text-xs mt-2">
                每次對話限 5 回合 · 每則訊息限 20 字
            </p>
        </div>
        
        <!-- Input Section -->
        <div id="input-container" class="w-full max-w-xl layout-transition">
            
            <!-- Input Row -->
            <div class="flex items-center gap-3">
                <div class="relative flex-1">
                    <input 
                        type="text" 
                        id="user-input"
                        class="w-full bg-bg-secondary border border-border-color rounded-xl 
                               px-4 py-3.5 text-lg
                               text-text-primary placeholder-text-muted
                               focus:outline-none focus:border-white focus:ring-2 focus:ring-white/10
                               transition-all duration-200
                               input-interactive"
                        placeholder=""
                        maxlength="20"
                        autocomplete="off"
                        spellcheck="false"
                    >
                </div>
                
                <button 
                    id="send-button"
                    class="flex-shrink-0 bg-white text-bg-primary 
                           w-12 h-12 rounded-xl
                           flex items-center justify-center
                           text-xl font-bold
                           hover:bg-gray-100 active:bg-gray-200
                           disabled:opacity-50 disabled:cursor-not-allowed
                           transition-all duration-200
                           btn-interactive"
                    aria-label="發送訊息"
                >
                    →
                </button>
            </div>
            
            <!-- Input Meta Row -->
            <div class="flex justify-between items-center mt-2 px-1">
                <span id="input-error" class="text-red-400 text-sm opacity-0 transition-opacity duration-200 min-h-[1.25rem]" aria-live="polite"></span>
                <span id="char-count" class="text-meta text-text-muted">0/20</span>
            </div>
            
        </div>
        
    </main>
    
    <!-- Chat State Container (initially hidden) -->
    <div id="chat-container" class="min-h-screen flex flex-col hidden">
        
        <!-- Chat Header -->
        <header class="chat-header fixed top-0 left-0 right-0 bg-bg-primary/95 backdrop-blur-sm border-b border-border-color z-10 safe-area-top">
            <div class="container mx-auto px-4 py-3 flex items-center justify-between">
                <h1 class="text-xl font-bold text-white font-title">絢</h1>
                <div class="flex items-center gap-3">
                    <button 
                        id="help-button"
                        class="text-text-muted hover:text-white transition-colors"
                        aria-label="說明"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </button>
                    <button 
                        id="reset-button"
                        class="flex items-center gap-2 text-text-muted hover:text-white 
                               text-sm px-3 py-1.5 rounded-lg
                               hover:bg-white/5
                               transition-all duration-200"
                        aria-label="重新開始"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                        <span>重新開始</span>
                    </button>
                </div>
            </div>
        </header>
        
        <!-- Main Content Area -->
        <main class="flex-1 pt-[90px] pb-32 px-4">
            <div class="container mx-auto max-w-2xl">
                
                <!-- Topic Display -->
                <div id="topic-section" class="mb-6 pb-4 border-b border-border-color/50 hidden">
                    <div class="flex items-center gap-2">
                        <span class="text-text-muted text-sm">主題</span>
                        <span class="text-text-muted">·</span>
                        <span id="topic-display" class="text-text-secondary text-sm font-medium"></span>
                    </div>
                </div>
                
                <!-- AI Response Area -->
                <div id="ai-response-container" class="hidden">
                    <p id="ai-response" class="text-lg md:text-xl lg:text-2xl leading-relaxed md:leading-loose text-white text-streaming"></p>
                </div>
                
            </div>
        </main>
        
        <!-- Fixed Bottom Input -->
        <footer class="fixed bottom-0 left-0 right-0 bg-bg-primary/95 backdrop-blur-sm border-t border-border-color p-4 safe-area-bottom">
            <div class="container mx-auto max-w-xl">
                
                <!-- Conversation Dots and Character Count -->
                <div class="flex items-center justify-between mb-3">
                    <div id="conversation-dots" class="flex items-center gap-1.5" aria-label="對話進度">
                        <!-- Will be populated by JavaScript -->
                    </div>
                    <span id="char-count-chat" class="text-meta text-text-muted">0/20</span>
                </div>
                
                <!-- Input Row -->
                <div class="flex items-center gap-3">
                    <div class="relative flex-1">
                        <input 
                            type="text" 
                            id="user-input-chat"
                            class="w-full bg-bg-secondary border border-border-color rounded-xl 
                                   px-4 py-3.5 text-base md:text-lg
                                   text-text-primary placeholder-text-muted
                                   focus:outline-none focus:border-white focus:ring-2 focus:ring-white/10
                                   transition-all duration-200
                                   input-interactive"
                            placeholder=""
                            maxlength="20"
                            autocomplete="off"
                            spellcheck="false"
                        >
                    </div>
                    
                    <button 
                        id="send-button-chat"
                        class="flex-shrink-0 bg-white text-bg-primary 
                               w-12 h-12 rounded-xl
                               flex items-center justify-center
                               text-xl font-bold
                               hover:bg-gray-100 active:bg-gray-200
                               disabled:opacity-50 disabled:cursor-not-allowed
                               transition-all duration-200
                               btn-interactive"
                        aria-label="發送訊息"
                    >
                        →
                    </button>
                </div>
                
                <!-- Input Meta Row -->
                <div class="flex justify-between items-center mt-2 px-1">
                    <span id="input-error-chat" class="text-red-400 text-sm opacity-0 transition-opacity duration-200 min-h-[1.25rem]" aria-live="polite"></span>
                </div>
                
            </div>
        </footer>
        
    </div>
    
    <!-- Network status toast (Task 6.1.2) -->
    <div id="network-toast" class="network-toast hidden"></div>
    
    <!-- Help Modal (Task 6.3.3) -->
    <div id="help-modal" class="modal-backdrop hidden">
        <div class="modal-content">
            <h2 class="modal-title">使用說明</h2>
            
            <div class="space-y-4 text-text-secondary text-sm">
                <div>
                    <h3 class="text-white font-medium mb-1">如何使用</h3>
                    <p>輸入您的想法（最多 20 字），按 Enter 或點擊傳送按鈕，AI 會為您生成絢爛的回應。</p>
                </div>
                
                <div>
                    <h3 class="text-white font-medium mb-1">對話限制</h3>
                    <p>每次對話最多可進行 5 個回合。達到上限後可以點擊「重新開始」開始新對話。</p>
                </div>
            </div>
            
            <button 
                id="close-help"
                class="mt-6 w-full bg-white text-bg-primary py-2 rounded-lg font-medium hover:bg-gray-200 transition-colors"
            >
                了解了
            </button>
        </div>
    </div>
    
    <!-- JavaScript modules -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
